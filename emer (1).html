let answeredCount = 0;
let correctCount = 0;
let currentTotal = 0;

function updateMeter() {
  document.getElementById("answered").textContent = "Answered: " + answeredCount;
  document.getElementById("correct").textContent = "Correct: " + correctCount;
  const pct = currentTotal > 0 ? (correctCount / currentTotal) * 100 : 0;
  document.getElementById("scoreBar").style.width = Math.min(pct, 100) + "%";
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.exam-section').forEach(sec => sec.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  answeredCount = 0;
  correctCount = 0;
  currentTotal = examData[tabId] ? examData[tabId].length : 0;
  updateMeter();
  renderQuestions(tabId);
}

function renderQuestions(tabId) {
  const section = document.getElementById(tabId);
  section.innerHTML = "";
  if (!examData[tabId] || examData[tabId].length === 0) {
    section.innerHTML = '<div class="empty">No questions available for this section.</div>';
    return;
  }
  let questions = [...examData[tabId]];
  shuffleArray(questions);

  questions.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "question-card";

    const num = document.createElement("div");
    num.className = "question-num";
    num.textContent = "Q" + (index + 1);
    card.appendChild(num);

    const qText = document.createElement("div");
    qText.className = "question-text";
    qText.textContent = item.q;
    card.appendChild(qText);

    let options = [...item.options];
    shuffleArray(options);

    options.forEach(opt => {
      const optDiv = document.createElement("div");
      optDiv.className = "option";
      optDiv.textContent = opt;

      optDiv.onclick = () => {
        const allOptions = card.querySelectorAll(".option");
        allOptions.forEach(o => { o.classList.add("locked"); o.style.pointerEvents = "none"; });
        answeredCount++;
        if (opt === item.correct) {
          optDiv.classList.add("correct");
          correctCount++;
        } else {
          optDiv.classList.add("wrong");
          allOptions.forEach(o => {
            if (o.textContent === item.correct) o.classList.add("correct");
          });
        }
        updateMeter();
      };

      card.appendChild(optDiv);
    });

    section.appendChild(card);
  });
}

currentTotal = examData['lec2'] ? examData['lec2'].length : 0;
renderQuestions('lec2');
updateMeter();
