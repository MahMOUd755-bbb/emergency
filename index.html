<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Critical Care & Emergency Nursing — Exam Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #eef2f7;
    color: #2c3e50;
    min-height: 100vh;
    padding: 30px 16px 60px;
  }

  /* ── Header ── */
  .portal-header {
    text-align: center;
    margin-bottom: 10px;
    position: relative;
  }

  .portal-header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.4rem, 3.5vw, 1.9rem);
    font-weight: 800;
    color: #2c3e50;
    margin-bottom: 0;
  }

  /* ── Donate button ── */
  .donate-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 12px;
    padding: 9px 22px;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(238,90,36,0.38);
    transition: transform 0.18s, box-shadow 0.18s;
    letter-spacing: 0.02em;
    animation: pulse-donate 2.4s infinite;
  }

  .donate-btn:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 8px 28px rgba(238,90,36,0.5);
    animation: none;
  }

  .donate-btn .heart-icon {
    font-size: 15px;
    animation: heartbeat 1.2s infinite;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(1); }
    75% { transform: scale(1.2); }
  }

  @keyframes pulse-donate {
    0%,100% { box-shadow: 0 4px 18px rgba(238,90,36,0.38); }
    50% { box-shadow: 0 4px 28px rgba(238,90,36,0.65); }
  }

  /* ── Donate Modal overlay ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,20,0.6);
    backdrop-filter: blur(7px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-overlay.open { display: flex; }

  /* ── Donate Modal card ── */
  .donate-modal {
    width: 100%;
    max-width: 460px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 28px 70px rgba(0,0,0,0.45);
    animation: popIn 0.28s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    font-family: 'DM Sans', sans-serif;
  }

  @keyframes popIn {
    from { transform: scale(0.82) translateY(24px); opacity: 0; }
    to   { transform: scale(1) translateY(0);   opacity: 1; }
  }

  /* dark header */
  .dw-head {
    background: #1a1a2e;
    padding: 2rem 2rem 1.6rem;
    text-align: center;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px; right: 14px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 30px; height: 30px;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  .dw-pulse {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(127,119,221,0.15);
    border: 1.5px solid rgba(127,119,221,0.4);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    animation: dwpulse 2.4s ease-in-out infinite;
  }
  @keyframes dwpulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.08); opacity: 0.75; }
  }

  .dw-head h3 {
    margin: 0 0 5px;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
  }

  .dw-head p {
    margin: 0;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
  }

  /* body */
  .dw-body {
    background: #0d1117;
    border-top: none;
    padding: 1.25rem;
  }

  .dw-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 0.25rem 0 1rem;
  }
  .dw-divider span {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .dw-divider hr {
    flex: 1; border: none;
    border-top: 0.5px solid rgba(255,255,255,0.1);
  }

  /* payment cards */
  .dw-card {
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    border: 0.5px solid transparent;
    transition: border-color 0.15s;
  }
  .dw-card:hover { border-color: rgba(255,255,255,0.15); }
  .dw-card-vf { background: #16213e; }
  .dw-card-ip { background: #0f3460; }

  .dw-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .dw-lbl {
    font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin: 0 0 3px;
  }

  .dw-num {
    font-size: 20px; font-weight: 500;
    letter-spacing: 0.06em;
    color: #fff; margin: 0;
  }

  .dw-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.1);
    border: 0.5px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    transition: background 0.15s;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    white-space: nowrap;
  }
  .dw-btn:hover { background: rgba(255,255,255,0.18); }
  .dw-btn:active { transform: scale(0.97); }

  .dw-footer {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    margin-top: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .header-divider {
    height: 4px;
    background: #3498db;
    max-width: 860px;
    margin: 14px auto 24px;
    border-radius: 2px;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    padding: 30px 28px 40px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }

  /* Tabs */
  .nav-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }

  .tab-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e0e6ed;
    color: #4a5568;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .tab-btn:hover {
    background: #ccd6e0;
    color: #2c3e50;
  }

  .tab-btn.active {
    background: #3498db;
    color: #fff;
    box-shadow: 0 2px 8px rgba(52,152,219,0.35);
  }

  /* Score meter */
  .meter {
    text-align: center;
    font-weight: 700;
    font-size: 1rem;
    color: #2c3e50;
    margin-bottom: 22px;
  }

  .meter span { margin: 0 6px; }

  .score-bar-wrap {
    max-width: 400px;
    margin: 0 auto 28px;
    background: #e0e6ed;
    border-radius: 999px;
    height: 6px;
    overflow: hidden;
  }

  .score-bar {
    height: 100%;
    background: linear-gradient(90deg, #3498db, #27ae60);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Section */
  .exam-section { display: none; }
  .exam-section.active { display: block; }

  /* Question card */
  .question-card {
    background: #fff;
    border-left: 5px solid #3498db;
    border-radius: 6px;
    padding: 20px 20px 18px;
    margin-bottom: 22px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .question-num {
    font-size: 0.95rem;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 6px;
  }

  .question-text {
    font-size: 1rem;
    font-weight: 600;
    color: #2563a8;
    line-height: 1.55;
    margin-bottom: 14px;
  }

  .option {
    padding: 9px 14px;
    margin: 6px 0;
    border: 2px solid #eaeff2;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.92rem;
    color: #2c3e50;
    transition: all 0.15s ease;
    background: #fff;
  }

  .option:hover:not(.locked) {
    background: #f0f7ff;
    border-color: #3498db;
  }

  .option.correct {
    background: #d4edda !important;
    border-color: #28a745 !important;
    color: #155724;
    font-weight: 600;
  }

  .option.wrong {
    background: #f8d7da !important;
    border-color: #dc3545 !important;
    color: #721c24;
  }

  .option.locked { cursor: default; }

  /* Empty state */
  .empty {
    text-align: center;
    color: #8b90a7;
    padding: 60px 20px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<div class="portal-header">
  <h1>Critical Care &amp; Emergency Nursing — Exam Portal</h1>

</div>
<div class="header-divider"></div>

<!-- Donation Modal -->
<div class="modal-overlay" id="donateOverlay" onclick="closeDonateOutside(event)">
  <div class="donate-modal" id="donateModal">
    <div class="modal-banner">
      <button class="modal-close" onclick="closeDonate()" aria-label="Close">✕</button>
      <div class="heart-big">❤️</div>
      <h2>Support Us</h2>
      <p>Every contribution makes a difference. Thank you 🤍</p>
    </div>

    <div class="modal-body">
      <div class="pay-row">
        <div class="pay-icon vf">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>
        <div class="pay-info">
          <div class="pay-label">VF Cash</div>
          <div class="pay-number">01093566524</div>
        </div>
        <button class="copy-btn" onclick="copyNum('01093566524', this)">
          <i class="fa-regular fa-copy"></i> Copy
        </button>
      </div>

      <div class="pay-row">
        <div class="pay-icon ip">
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </div>
        <div class="pay-info">
          <div class="pay-label">InstaPay</div>
          <div class="pay-number">01110417490</div>
        </div>
        <button class="copy-btn" onclick="copyNum('01110417490', this)">
          <i class="fa-regular fa-copy"></i> Copy
        </button>
      </div>
    </div>

    <div class="modal-footer">Tap "Copy" to copy the number, then open your app to send.</div>
  </div>
</div>

<div class="container">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('lec2', this)">Bleeding &amp; Fractures</button>
    <button class="tab-btn" onclick="switchTab('lec3', this)">BLS &amp; AED</button>
    <button class="tab-btn" onclick="switchTab('lec4', this)">Poisoning &amp; Heat/Cold</button>
    <button class="tab-btn" onclick="switchTab('lec6', this)">Triage &amp; Emergency</button>
    <button class="tab-btn" onclick="switchTab('lec7', this)">Cardiac Emergencies</button>
    <button class="tab-btn" onclick="switchTab('lec89', this)">Abdominal &amp; GI</button>
    <button class="tab-btn" onclick="switchTab('trauma', this)">Head, Chest &amp; Spinal</button>
  </div>

  <div class="meter">
    <span id="answered">Answered: 0</span> | <span id="correct">Correct: 0</span>
  </div>
  <div class="score-bar-wrap"><div class="score-bar" id="scoreBar"></div></div>

  <div id="lec2" class="exam-section active"></div>
  <div id="lec3" class="exam-section"></div>
  <div id="lec4" class="exam-section"></div>
  <div id="lec6" class="exam-section"></div>
  <div id="lec7" class="exam-section"></div>
  <div id="lec89" class="exam-section"></div>
  <div id="trauma" class="exam-section"></div>
</div>

<script>
const examData = {
  lec2: [
    {q:"What is the definition of bleeding?",options:["Escape of air from the lungs","Escape or loss of blood from the circulatory system","Loss of plasma only","Accumulation of fluid in tissues"],correct:"Escape or loss of blood from the circulatory system"},
    {q:"Which type of external bleeding is considered the MOST serious?",options:["Capillary bleeding","Venous bleeding","Arterial bleeding","Internal bleeding"],correct:"Arterial bleeding"},
    {q:"How is arterial bleeding characterized?",options:["Dark red, steady flow","Oozing from small vessels","Bright red blood that spurts with each heartbeat","Slow seeping of blood"],correct:"Bright red blood that spurts with each heartbeat"},
    {q:"Which type of bleeding is the MOST common?",options:["Arterial","Venous","Capillary","Internal"],correct:"Capillary"},
    {q:"What is hypo-perfusion?",options:["Excessive circulation of blood","Inadequate circulation of blood through an organ","Increased blood pressure","Normal blood flow"],correct:"Inadequate circulation of blood through an organ"},
    {q:"How much blood loss in an adult is considered serious?",options:["500 mL","1 liter","2 liters","250 mL"],correct:"1 liter"},
    {q:"What is the FIRST step in first aid for external bleeding?",options:["Apply ice directly","Put the victim in a lying position","Apply a tourniquet","Give oral fluids"],correct:"Put the victim in a lying position"},
    {q:"If the dressing becomes soaked with blood during first aid, what should you do?",options:["Remove it and start over","Apply another dressing on top","Apply direct ice","Leave it alone"],correct:"Apply another dressing on top"},
    {q:"When should you elevate the bleeding area?",options:["Immediately as first step","Only if patient is unconscious","If bleeding continues after direct pressure","Never"],correct:"If bleeding continues after direct pressure"},
    {q:"What is epistaxis?",options:["Bleeding from the ear","Bleeding from the rectum","Bleeding from the nose","Bleeding from the mouth"],correct:"Bleeding from the nose"},
    {q:"What is the correct head position for a patient with epistaxis?",options:["Head tilted back","Head forward and slightly flexed","Head tilted to the side","Lying flat"],correct:"Head forward and slightly flexed"},
    {q:"How long should you apply pressure on the nostrils for epistaxis?",options:["1–2 minutes","5–10 minutes","20–30 minutes","1 minute only"],correct:"5–10 minutes"},
    {q:"Which of the following is a cause of epistaxis?",options:["Hypertension","Hypothyroidism","Diabetes insipidus","Pulmonary edema"],correct:"Hypertension"},
    {q:"What should the patient do if blood accumulates in the mouth during epistaxis?",options:["Swallow the blood","Blow the nose forcefully","Spit it out without blowing the nose","Ignore it"],correct:"Spit it out without blowing the nose"},
    {q:"What is a fracture?",options:["A sprain of the ligament","A dislocation of a joint","Any break in the continuity of a bone","Tearing of a muscle"],correct:"Any break in the continuity of a bone"},
    {q:"Which of the following is a common cause of fractures?",options:["High humidity","Viral infections","Fall from height","Adequate nutrition"],correct:"Fall from height"},
    {q:"Which sign is MOST indicative of a fracture?",options:["Itching at the site","Deformity of the limb","Increased skin temperature only","Redness without swelling"],correct:"Deformity of the limb"},
    {q:"What should you do FIRST in an emergency fracture situation if shock is present?",options:["Straighten the limb","Treat the victim for shock","Apply cold packs only","Ignore shock and focus on fracture"],correct:"Treat the victim for shock"},
    {q:"What should you NOT do when treating a fractured limb?",options:["Apply a splint","Attempt to straighten a bent or deformed limb","Cover broken skin with clean cloth","Control external bleeding"],correct:"Attempt to straighten a bent or deformed limb"},
    {q:"How should bandaging be applied over a splint?",options:["As tight as possible to restrict movement","Firm enough to secure splint but not restrict blood flow","Very loosely","Without any padding"],correct:"Firm enough to secure splint but not restrict blood flow"},
    {q:"Where should splint bandages be secured?",options:["Only at the fracture site","Above and below the fracture site","Only below the fracture","At the joint above only"],correct:"Above and below the fracture site"},
    {q:"How should upper limb fractures be managed after splinting?",options:["Immobilize in a straight position","Support in a sling","Wrap tightly around the body","Elevate above the head"],correct:"Support in a sling"},
    {q:"What is a late sign of internal bleeding?",options:["Pain at injury site","Vomiting blood","Dilated pupils","Swelling"],correct:"Dilated pupils"},
    {q:"Which of the following indicates internal bleeding?",options:["Clear urine output","Capillary refill > 2 seconds","Normal blood pressure","Alert mental status"],correct:"Capillary refill > 2 seconds"},
    {q:"What does blood in vomit that looks like coffee grounds suggest?",options:["Arterial bleeding","Fresh active GI hemorrhage","Older GI bleeding","Normal finding"],correct:"Older GI bleeding"},
    {q:"What is the FIRST aid step for internal bleeding in an extremity?",options:["Apply heat","Apply direct pressure if the injury is on an extremity","Give oral fluids","Elevate legs immediately"],correct:"Apply direct pressure if the injury is on an extremity"},
    {q:"What is the immediate care for airway in internal bleeding first aid?",options:["Provide airway care and oxygen","Apply pressure to the abdomen","Administer pain medication","Nothing – wait for ambulance"],correct:"Provide airway care and oxygen"},
    {q:"What is the normal capillary refill time?",options:["Less than 2 seconds","3–4 seconds","5–6 seconds","More than 6 seconds"],correct:"Less than 2 seconds"},
    {q:"Which type of venous bleeding flow is characteristic?",options:["Spurting with each heartbeat","Oozing slowly","Steady or gushing dark red flow","Only visible internally"],correct:"Steady or gushing dark red flow"},
    {q:"A patient loses 100–200 mL of blood. What age group is this considered serious for?",options:["Adults","Children","Infants","Elderly"],correct:"Infants"},
    {q:"During indirect pressure technique for bleeding, what else must be maintained?",options:["Elevation alone","Direct pressure and elevation","Cold compress only","Tourniquet instead"],correct:"Direct pressure and elevation"},
    {q:"Which of the following is NOT a cause of epistaxis?",options:["Nasal tumors","Low humidity","High blood pressure","Fracture of the femur"],correct:"Fracture of the femur"},
    {q:"Before and after splinting a fracture, what must be assessed?",options:["Blood glucose","Circulation, sensory, and motor function","Pain score only","Temperature only"],correct:"Circulation, sensory, and motor function"},
    {q:"What should be done with any broken skin in an open fracture?",options:["Leave it open to air","Cover it with a clean or sterile cloth","Apply antibiotic cream immediately","Irrigate with saline"],correct:"Cover it with a clean or sterile cloth"},
    {q:"What happens to the body when there is uncontrolled significant blood loss?",options:["Hypertension","Shock (hypoperfusion) and possibly death","Fever","Increased urine output"],correct:"Shock (hypoperfusion) and possibly death"},
    {q:"How much blood loss is considered serious in a child?",options:["1 liter","250 mL","Half a liter (500 mL)","100 mL"],correct:"Half a liter (500 mL)"},
    {q:"When protecting yourself while giving first aid for bleeding, what should you do?",options:["Use bare hands if gloves unavailable","Protect yourself before touching victim","Ask a bystander to help first","Only give first aid if wearing a full gown"],correct:"Protect yourself before touching victim"},
    {q:"Which step comes AFTER applying direct pressure in external bleeding first aid?",options:["Apply tourniquet immediately","If dressing soaks through, add another dressing on top","Remove all dressings","Apply cold pack"],correct:"If dressing soaks through, add another dressing on top"},
    {q:"What is the significance of checking the injured area after reassessment for epistaxis?",options:["To confirm fracture","To assess if bleeding stopped; if not, repeat pressure with ice for 10 more minutes","To check for infection","To determine if surgery is needed"],correct:"To assess if bleeding stopped; if not, repeat pressure with ice for 10 more minutes"},
    {q:"After epistaxis stops, what advice should be given to the patient?",options:["Blow nose vigorously to clear clot","Rest for a few hours","Resume vigorous activity immediately","Apply hot towel"],correct:"Rest for a few hours"},
    {q:"What type of clothing should be removed first in external bleeding first aid?",options:["Clothing below the bleeding area","Clothing above the bleeding area","All clothing on the body","Only jewelry"],correct:"Clothing above the bleeding area"},
    {q:"What does 'indirect pressure' in bleeding control mean?",options:["Pressure applied directly over the wound","Pressure applied to a proximal artery combined with direct pressure and elevation","Pressure applied via tourniquet only","Pressure applied distal to the wound"],correct:"Pressure applied to a proximal artery combined with direct pressure and elevation"},
    {q:"What does deformity of a limb indicate in the context of trauma?",options:["Muscle spasm only","Possible fracture","Skin infection","Nerve damage only"],correct:"Possible fracture"},
    {q:"Why should you NOT press over the fracture site when controlling bleeding in an open fracture?",options:["It causes more bleeding","It can cause further bone displacement and damage","It is too painful","It blocks venous return"],correct:"It can cause further bone displacement and damage"},
    {q:"What does a fracture of the upper limb require in addition to splinting?",options:["Traction","Support in a sling with possible extra padding at fracture site","Immediate surgery","Full body cast"],correct:"Support in a sling with possible extra padding at fracture site"},
    {q:"Which symptom differentiates a fracture from a sprain?",options:["Swelling","Hearing the bone break / deformity","Pain","Tenderness"],correct:"Hearing the bone break / deformity"},
    {q:"What is the relationship between blood loss and shock?",options:["Blood loss has no effect on blood pressure","Significant blood loss leads to shock via hypoperfusion","Only arterial blood loss causes shock","Shock causes blood loss"],correct:"Significant blood loss leads to shock via hypoperfusion"},
    {q:"What is the color of venous blood?",options:["Bright red","Pink","Dark red","Blue-black"],correct:"Dark red"},
    {q:"A patient has a suspected femur fracture with external bleeding. What is the correct sequence?",options:["Splint first, then control bleeding","Control bleeding first, then assess neurovascular status and splint","Apply tourniquet immediately","Give pain relief first"],correct:"Control bleeding first, then assess neurovascular status and splint"},
    {q:"Which investigation is NOT typically needed first for a simple closed fracture?",options:["Physical examination","X-ray","Emergency surgery","Assessment of neurovascular status"],correct:"Emergency surgery"},
  ],
  lec3: [
    {q:"What does CPR stand for?",options:["Cardiopulmonary Resuscitation","Cardiac Pressure Relief","Cerebral Perfusion Recovery","Cardiopulmonary Rehabilitation"],correct:"Cardiopulmonary Resuscitation"},
    {q:"CPR is an emergency procedure that begins with:",options:["Rescue breaths followed by compressions","Immediate delivery of chest compressions followed by ventilations","Calling for help first only","Using an AED immediately"],correct:"Immediate delivery of chest compressions followed by ventilations"},
    {q:"Which of the following is a purpose of CPR?",options:["To replace definitive medical care","To maintain airway patency and sustain life","To diagnose the cause of arrest","To sedate the patient"],correct:"To maintain airway patency and sustain life"},
    {q:"What is a sign of cardiac arrest?",options:["Bradycardia with consciousness","Loss of consciousness with absent pulse","Hypertension","Normal pupil size"],correct:"Loss of consciousness with absent pulse"},
    {q:"What does pulselessness in cardiac arrest involve?",options:["Peripheral arteries only","Large arteries such as carotid and femoral","All veins","Capillaries only"],correct:"Large arteries such as carotid and femoral"},
    {q:"What pupil change is expected in cardiac arrest?",options:["Constricted pupils","Normal pupils","Dilated pupils","Unequal pupils"],correct:"Dilated pupils"},
    {q:"What does BLS stand for?",options:["Basic Lung Support","Basic Life Support","Bilateral Life Support","Body Lifesaving System"],correct:"Basic Life Support"},
    {q:"What are the three components of BLS?",options:["Diagnosis, drugs, defibrillation","Circulation, Airway, Breathing","CPR, AED, transport","Assessment, ventilation, fluids"],correct:"Circulation, Airway, Breathing"},
    {q:"What does ACLS include in addition to BLS?",options:["Only oxygen therapy","ECG, defibrillation, IV access, and drug therapy","Manual ventilation only","Diet modifications"],correct:"ECG, defibrillation, IV access, and drug therapy"},
    {q:"How long should you check for a carotid pulse?",options:["1–2 seconds","Up to 5 seconds","5–10 seconds (no more than 10)","30 seconds"],correct:"5–10 seconds (no more than 10)"},
    {q:"If a patient has a pulse but is not breathing, how many rescue breaths per minute are given?",options:["5","10","15","20"],correct:"10"},
    {q:"How often should the pulse be rechecked during rescue breathing?",options:["Every 30 seconds","Every 1 minute","Every 2 minutes","Every 5 minutes"],correct:"Every 2 minutes"},
    {q:"What is the correct chest compression rate per minute?",options:["60–80","80–100","100–120","120–140"],correct:"100–120"},
    {q:"In adult CPR, where should hands be placed for compressions?",options:["Upper third of sternum","Lower third of sternum between the nipples","Over the abdomen","Left side of chest"],correct:"Lower third of sternum between the nipples"},
    {q:"What is the correct compression depth for adults?",options:["1–2 inches","2–2.4 inches (5–6 cm)","3–4 inches","As deep as possible"],correct:"2–2.4 inches (5–6 cm)"},
    {q:"What is one cycle of adult CPR?",options:["15 compressions to 1 breath","30 compressions to 2 rescue breaths","5 compressions to 1 breath","20 compressions to 2 breaths"],correct:"30 compressions to 2 rescue breaths"},
    {q:"How many CPR cycles should be completed before checking rhythm with an AED?",options:["1 cycle","3 cycles","5 cycles (approximately 2 minutes)","10 cycles"],correct:"5 cycles (approximately 2 minutes)"},
    {q:"When two rescuers are present, how often should they switch roles?",options:["Every 2 cycles","Every 5 cycles","Every 10 minutes","When one is tired only"],correct:"Every 5 cycles"},
    {q:"What maneuver is used to open the airway in a non-trauma patient?",options:["Jaw thrust","Head tilt–chin lift","Finger sweep only","Mask placement"],correct:"Head tilt–chin lift"},
    {q:"What maneuver is used to open the airway if head or neck injury is suspected?",options:["Head tilt–chin lift","Finger sweep","Jaw thrust","Hyperextension"],correct:"Jaw thrust"},
    {q:"How do you assess for breathing?",options:["Pulse oximetry only","Look, listen, and feel","Take blood pressure","Check pupils"],correct:"Look, listen, and feel"},
    {q:"If a patient is breathing normally but unconscious, what position should they be placed in?",options:["Prone position","Recovery position","Supine with legs elevated","Sitting position"],correct:"Recovery position"},
    {q:"What does full chest recoil between compressions allow?",options:["More blood to go to the lungs","Venous return to refill the heart","Prevents rib fractures","Reduces compression fatigue"],correct:"Venous return to refill the heart"},
    {q:"What is the Heimlich maneuver used for?",options:["Cardiac arrest","Airway obstruction (choking)","Head injury","Seizures"],correct:"Airway obstruction (choking)"},
    {q:"How many abdominal thrusts are applied in the Heimlich maneuver?",options:["3 thrusts","5 thrusts","10 thrusts","2 thrusts"],correct:"5 thrusts"},
    {q:"For an unconscious choking victim, CPR is started, but what extra step is added?",options:["Give extra breaths only","Look for the obstructing object before each breath and remove if visible","Skip compressions","Apply oxygen mask"],correct:"Look for the obstructing object before each breath and remove if visible"},
    {q:"What is an AED?",options:["A manual defibrillator only used by doctors","A small portable device that gives electric shock to restore heartbeat","A ventilator","A blood pressure monitor"],correct:"A small portable device that gives electric shock to restore heartbeat"},
    {q:"What is the purpose of an AED?",options:["Provide oxygen","Rapidly identify and provide early defibrillation in cardiac arrest","Measure blood glucose","Give medications"],correct:"Rapidly identify and provide early defibrillation in cardiac arrest"},
    {q:"At what age should adult AED pads NOT be used without pediatric pads?",options:["Under 12 years","Under 10 years","Under 8 years","Under 5 years"],correct:"Under 8 years"},
    {q:"Should you touch the victim while the AED analyzes the rhythm?",options:["Yes, continue CPR","No, touching affects the rhythm analysis","Only if wearing gloves","Yes, but only to check pulse"],correct:"No, touching affects the rhythm analysis"},
    {q:"Can an AED be used in a moving vehicle?",options:["Yes, always","Only in an ambulance","No, do not use in a moving vehicle","Only at slow speeds"],correct:"No, do not use in a moving vehicle"},
    {q:"How close can a mobile phone be placed to an AED without interference risk?",options:["Within 2 feet","Within 6 feet","No restriction","10 feet minimum"],correct:"Within 6 feet"},
    {q:"Before delivering a shock with AED, what must be ensured?",options:["Patient is on a wet surface","The area around the patient is clear","Phone is nearby","Patient is restrained"],correct:"The area around the patient is clear"},
    {q:"In infant CPR, what is the compression-to-breath ratio?",options:["30:2","15:2","5:1","10:2"],correct:"5:1"},
    {q:"What rate of compressions is used in infant CPR?",options:["60 per minute","80 per minute","100 per minute","120 per minute"],correct:"100 per minute"},
    {q:"For infants with a pulse but not breathing, rescue breaths are given every:",options:["6 seconds","3 seconds","10 seconds","2 seconds"],correct:"3 seconds"},
    {q:"For a conscious infant with airway obstruction, what is the sequence?",options:["5 chest thrusts only","5 back blows then 5 chest thrusts, repeated until expelled","Abdominal thrusts","Finger sweep immediately"],correct:"5 back blows then 5 chest thrusts, repeated until expelled"},
    {q:"For an unconscious infant with airway obstruction, what is given FIRST?",options:["5 back blows","5 chest thrusts","2 slow breaths","Check mouth first"],correct:"2 slow breaths"},
    {q:"When should CPR be stopped?",options:["After 5 minutes always","When victim revives, trained help arrives, or rescuer is completely exhausted","After 30 compressions only","When AED arrives"],correct:"When victim revives, trained help arrives, or rescuer is completely exhausted"},
    {q:"What does PLS (Prolonged Life Support) focus on?",options:["Basic compressions","Post-resuscitation care and brain protection in ICU","Use of defibrillation","Drug therapy only"],correct:"Post-resuscitation care and brain protection in ICU"},
    {q:"What does 'full chest recoil' mean during CPR compressions?",options:["Pushing harder each time","Allowing the chest to fully rise back to normal position between compressions","Holding compressions for 2 seconds","Pushing to maximum depth always"],correct:"Allowing the chest to fully rise back to normal position between compressions"},
    {q:"What should be done if no air enters during rescue breaths?",options:["Immediately apply AED","Retilt head and try 2 more breaths; if unsuccessful, suspect choking","Increase breath force","Stop and wait"],correct:"Retilt head and try 2 more breaths; if unsuccessful, suspect choking"},
    {q:"What is the gasping or absent respiration seen in cardiac arrest called?",options:["Kussmaul breathing","Agonal respiration","Cheyne-Stokes breathing","Normal variation"],correct:"Agonal respiration"},
    {q:"If two rescue breaths are given per cycle in adult CPR, how long should each breath last?",options:["0.5 seconds","1 second","2 seconds","3 seconds"],correct:"1 second"},
    {q:"In the pediatric chain of survival, which comes FIRST?",options:["Early CPR","EMS activation","Prevention","Rapid PALS"],correct:"Prevention"},
    {q:"Where is the carotid pulse checked in adults?",options:["On the wrist","On the neck","On the ankle","On the groin"],correct:"On the neck"},
    {q:"If a rescuer is alone performing adult CPR, when should they activate EMS?",options:["After 10 minutes of CPR","Immediately after confirming unresponsiveness","After giving 5 cycles","When AED arrives"],correct:"Immediately after confirming unresponsiveness"},
    {q:"What does 'Press hard and fast' during compressions mean?",options:["Quick light taps","100–120/min at 2–2.4 inch depth with full recoil","Slow deep compressions","Variable speed"],correct:"100–120/min at 2–2.4 inch depth with full recoil"},
    {q:"An AED should NOT be used near which material?",options:["Plastic","Flammable materials such as gasoline","Rubber","Cotton"],correct:"Flammable materials such as gasoline"},
    {q:"What is the role of alcohol in AED preparation?",options:["Use it to wipe chest for better pad adherence","Do not use alcohol to wipe the victim's chest","Use it to clean the pads","Apply it after shock delivery"],correct:"Do not use alcohol to wipe the victim's chest"},
    {q:"What does the finger sweep technique involve?",options:["Blindly sweeping fingers in the mouth","Grasping and removing the foreign body if within reach, without forcing it deeper","Pushing object deeper to clear airway","Applying suction"],correct:"Grasping and removing the foreign body if within reach, without forcing it deeper"},

  lec4: [
    {q:"What is the definition of a poison?",options:["Any substance taken in large amounts","A substance causing illness/death in relatively small quantities","Only chemical substances","Only naturally occurring toxins"],correct:"A substance causing illness/death in relatively small quantities"},
    {q:"What percentage of all poisoning cases are caused by ingestion?",options:["More than 50%","More than 60%","More than 80%","More than 90%"],correct:"More than 80%"},
    {q:"Which sign is specific to ingested poisoning?",options:["Liquid on skin","Chemical-smelling breath and burns around the mouth","Itching and redness","Bite mark"],correct:"Chemical-smelling breath and burns around the mouth"},
    {q:"What should be done FIRST for ingested poisoning?",options:["Induce vomiting immediately","Check pulse and respiration; perform CPR if absent","Give milk to dilute","Apply activated charcoal"],correct:"Check pulse and respiration; perform CPR if absent"},
    {q:"What percentage of poison does inducing vomiting remove from the stomach?",options:["10–20%","30–50%","60–70%","80–90%"],correct:"30–50%"},
    {q:"Within what time frame must vomiting be induced for ingested poisoning?",options:["Within 10 minutes","Within 30 minutes","Within 1 hour","Within 2 hours"],correct:"Within 30 minutes"},
    {q:"When should vomiting NOT be induced?",options:["For all pill ingestion","If victim is unconscious or having convulsions","For liquid poisons only","After 1 hour of ingestion"],correct:"If victim is unconscious or having convulsions"},
    {q:"Why should salt water NOT be used to induce vomiting?",options:["It has no effect","It can be dangerous and kill children","It causes constipation","It interferes with medication"],correct:"It can be dangerous and kill children"},
    {q:"What should be kept after the victim vomits?",options:["Nothing","A sample of vomit, urine, and stool","Only vomit sample","Only urine sample"],correct:"A sample of vomit, urine, and stool"},
    {q:"What should be given if the victim swallowed corrosives like acids or alkalis?",options:["Induce vomiting","Water or milk to dilute","Activated charcoal","Nothing"],correct:"Water or milk to dilute"},
    {q:"What is a contraindication for activated charcoal?",options:["Ingestion of tablets","Altered mental status or ingestion of acid/alkali","All ingested poisons","Diarrhea"],correct:"Altered mental status or ingestion of acid/alkali"},
    {q:"What type of gas is carbon monoxide?",options:["Green and fragrant","Colorless, odorless, tasteless","Yellow and pungent","Visible and heavy"],correct:"Colorless, odorless, tasteless"},
    {q:"How does carbon monoxide cause harm?",options:["By irritating the airways","By displacing oxygen in red blood cells causing hypoxia","By destroying lung tissue","By raising body temperature"],correct:"By displacing oxygen in red blood cells causing hypoxia"},
    {q:"Carbon monoxide results from:",options:["Complete combustion","Incomplete combustion","Oxidation of nitrogen","Bacterial activity"],correct:"Incomplete combustion"},
    {q:"Which symptom is associated with inhaled poisoning?",options:["Burns around mouth","Confusion and dizziness","Skin rash","Abdominal distension only"],correct:"Confusion and dizziness"},
    {q:"What is the FIRST action for inhaled poisoning?",options:["Give oxygen by mask","Turn off the source and call 123; ventilate the area","Start CPR immediately","Remove contaminated clothing first"],correct:"Turn off the source and call 123; ventilate the area"},
    {q:"For absorbed poisoning, how long should the eyes be flushed if poison entered them?",options:["5 minutes","10 minutes","At least 15 minutes","30 minutes"],correct:"At least 15 minutes"},
    {q:"What should be done with contaminated clothing in absorbed poisoning?",options:["Leave it on to protect skin","Remove clothing and flush affected skin with cool water","Apply antidote cream","Only wash the exposed area"],correct:"Remove clothing and flush affected skin with cool water"},
    {q:"What should be brought along if transporting a victim of absorbed poisoning?",options:["Nothing extra","A sample of the poisonous substance in a closed container","Victim's medical records","Water to flush again"],correct:"A sample of the poisonous substance in a closed container"},
    {q:"What are examples of injected poisons?",options:["Cleaning agents","Bees, poisonous insects, snakes, needles","Industrial fumes","Corroded metals"],correct:"Bees, poisonous insects, snakes, needles"},
    {q:"What is a sign of injected poisoning?",options:["Burns around the mouth","Weakness, dizziness, chills, fever, nausea","Difficulty breathing only","Chemical skin burns"],correct:"Weakness, dizziness, chills, fever, nausea"},
    {q:"What is the emergency number mentioned in the lectures for calling for help?",options:["911","999","123","115"],correct:"123"},
    {q:"What is heat exhaustion caused by?",options:["Brain thermostat failure","Loss of salt and water through excessive sweating","Viral infection","Muscle overuse only"],correct:"Loss of salt and water through excessive sweating"},
    {q:"Which skin sign is seen in heat exhaustion?",options:["Hot and dry","Flushed and red","Pale and clammy","Yellow and jaundiced"],correct:"Pale and clammy"},
    {q:"What is the FIRST action for heat exhaustion?",options:["Move the person out of heat to a cool/shaded place","Apply ice packs to groin","Give salt tablets","Start IV fluids"],correct:"Move the person out of heat to a cool/shaded place"},
    {q:"What position should the patient be placed in during heat exhaustion management?",options:["Sitting upright","Prone","Lay down with legs and feet slightly elevated","Standing"],correct:"Lay down with legs and feet slightly elevated"},
    {q:"What is heat stroke?",options:["Mild heat illness with sweating","Most serious form of heat injury, a medical emergency caused by thermostat failure in the brain","Cramps from salt loss","Mild dehydration"],correct:"Most serious form of heat injury, a medical emergency caused by thermostat failure in the brain"},
    {q:"Heat stroke is also known as:",options:["Heat exhaustion","Sunstroke","Hypothermia","Frostbite"],correct:"Sunstroke"},
    {q:"Which age group is MOST affected by heat stroke?",options:["Children under 10","Adults aged 20–30","People over age 50","Infants"],correct:"People over age 50"},
    {q:"What is a characteristic sign that differentiates heat stroke from heat exhaustion?",options:["Sweating increases","Pale skin","High body temperature with altered mental status","Low pulse rate"],correct:"High body temperature with altered mental status"},
    {q:"What cooling method is used for heat stroke?",options:["Warm blankets","Evaporative cooling — spray water while fans are running; ice packs to head, neck, armpits, groin","Oral hot fluids","Warm water bath"],correct:"Evaporative cooling — spray water while fans are running; ice packs to head, neck, armpits, groin"},
    {q:"What are heat cramps caused by?",options:["Excessive heat without fluid loss","Decrease in salt and water loss with exercise","Infection","Dehydration of the brain only"],correct:"Decrease in salt and water loss with exercise"},
    {q:"What is the treatment for heat cramps?",options:["Cold shower only","Administer fluids, salt in cool fruit juice, stretch cramped muscles","Bed rest only","IV antibiotics"],correct:"Administer fluids, salt in cool fruit juice, stretch cramped muscles"},
    {q:"What is frostbite?",options:["Hypothermia of the whole body","Injury caused by freezing of skin and underlying tissues","Chemical burn from cold exposure","Normal cold skin reaction"],correct:"Injury caused by freezing of skin and underlying tissues"},
    {q:"Which areas are MOST commonly affected by frostbite?",options:["Torso and back","Fingers, toes, nose, ears, cheeks, and chin","Inner arms and thighs","Palms and soles only"],correct:"Fingers, toes, nose, ears, cheeks, and chin"},
    {q:"What should be removed during frostbite first aid?",options:["Dry clothing only","All wet clothing and constrictive jewelry","Only shoes","Nothing until hospital"],correct:"All wet clothing and constrictive jewelry"},
    {q:"What should NOT be done to a frostbitten area?",options:["Keep it elevated","Rub the frozen area","Give warm fluids","Apply dry sterile bandage"],correct:"Rub the frozen area"},
    {q:"Why should you not walk on frostbitten toes or feet?",options:["It causes sweating","It can worsen tissue damage","It is too painful","It spreads the frostbite"],correct:"It can worsen tissue damage"},
    {q:"What is hypothermia defined as?",options:["Body temperature above 40°C","Internal body temperature below 35°C","Any cold sensation","Core temperature of 36°C"],correct:"Internal body temperature below 35°C"},
    {q:"What is primary hypothermia?",options:["Due to internal metabolic failure","Due to exposure to a cold or frigid environment","Caused by infection","From excessive sweating"],correct:"Due to exposure to a cold or frigid environment"},
    {q:"Which symptom is associated with hypothermia?",options:["Rapid speech","Shivering, slurred speech, confusion, weak pulse","Increased energy","High blood pressure"],correct:"Shivering, slurred speech, confusion, weak pulse"},
    {q:"When warming a hypothermic patient, what should be warmed FIRST?",options:["Hands and feet","Trunk first, not hands and feet","Head only","Extremities first"],correct:"Trunk first, not hands and feet"},
    {q:"What should NOT be done when treating hypothermia?",options:["Wrap in blankets","Apply dry clothing","Immerse the person in warm water (can cause heart arrhythmia)","Start CPR if not breathing"],correct:"Immerse the person in warm water (can cause heart arrhythmia)"},
    {q:"If using hot water bottles for hypothermia, what precaution is needed?",options:["Apply directly to skin for faster warming","Wrap them in cloth; do not apply directly to skin","Use only on the head","Place only on the feet"],correct:"Wrap them in cloth; do not apply directly to skin"},
    {q:"What type of poisoning does activated charcoal treat?",options:["All poisons including acids","Only poisoning by mouth (ingested)","Inhaled poisons only","Injected poisons"],correct:"Only poisoning by mouth (ingested)"},
    {q:"In absorbed poisoning, what is used to flush the skin?",options:["Warm soapy water","Cool water for several minutes","Alcohol solution","Vinegar solution"],correct:"Cool water for several minutes"},
    {q:"A victim with heat stroke has hot, dry skin. This is because:",options:["They are dehydrated only","The sweating mechanism has failed","They have a fever from infection","They are in heat exhaustion"],correct:"The sweating mechanism has failed"},
    {q:"Which cooling measure is appropriate for heat stroke?",options:["Covering with warm blankets","Placing ice packs to neck, armpits, and groin","Giving hot fluids","Avoiding all movement"],correct:"Placing ice packs to neck, armpits, and groin"},
    {q:"What is the primary difference between heat exhaustion and heat stroke?",options:["Heat exhaustion involves high temperature; heat stroke does not","Heat stroke involves failure of the brain's thermostat and is a medical emergency; heat exhaustion is milder","They are the same condition","Heat exhaustion is more serious"],correct:"Heat stroke involves failure of the brain's thermostat and is a medical emergency; heat exhaustion is milder"},
    {q:"Carbon monoxide causes hypoxia by:",options:["Destroying red blood cells","Taking the place of oxygen in red blood cells","Constricting airways","Blocking alveoli with fluid"],correct:"Taking the place of oxygen in red blood cells"},
    {q:"What emergency number should be called for National Poison Control Center guidance for injected poisoning?",options:["Call 911","Call National Poison Control Center immediately","Go to pharmacy first","Wait and observe"],correct:"Call National Poison Control Center immediately"},
  ],
  lec6: [
    {q:"What is emergency nursing?",options:["Routine care for stable patients","Specialized care for all ages with acute physical or emotional problems requiring immediate intervention","Long-term care for chronic diseases","Post-operative rehabilitation"],correct:"Specialized care for all ages with acute physical or emotional problems requiring immediate intervention"},
    {q:"What is the PRIMARY role of an emergency nurse?",options:["Administering routine medications","Triage and rapid assessment of severity and prioritization","Performing elective surgeries","Providing outpatient follow-up"],correct:"Triage and rapid assessment of severity and prioritization"},

    {q:"What is the maximum time a patient should wait for triage?",options:["10 minutes","15 minutes","5 minutes","30 minutes"],correct:"5 minutes"},

    {q:"A patient with head injury, alert, no vomiting is classified as:",options:["Resuscitation","Emergent","Urgent","Less urgent"],correct:"Less urgent"},
    {q:"A patient with minor trauma and no distress is classified as:",options:["Resuscitation","Emergent","Non-urgent","Urgent"],correct:"Non-urgent"},

    {q:"What does SAMPLE stand for in subjective data collection?",options:["Signs, Allergies, Medications, Pain, Labs, Examination","Symptoms, Allergies, Medications, Past history, Last meal, Events preceding","Status, Age, Medical, Pain, Location, Evaluation","Severity, Assessment, Medications, Pulse, Labs, Exam"],correct:"Symptoms, Allergies, Medications, Past history, Last meal, Events preceding"},
    {q:"What does ACBDE stand for in objective data?",options:["Assessment, Circulation, Breathing, Disability, Exposure","Airway, Circulation, Breathing, Disability (+ Exposure)","Airway, Cardiac, Blood, Diagnosis, Emergency","Alert, Compression, Breathing, Defibrillation, Evaluation"],correct:"Airway, Circulation, Breathing, Disability (+ Exposure)"},
    {q:"What does PQRST describe in the secondary survey?",options:["Pulse, Quality, Rate, Sounds, Temperature","Precipitating factors, Quality, Region/radiation, Severity, Time of onset","Pain, Questions, Regions, Signs, Tests","Primary, Quality, Risk, Seriousness, Timeline"],correct:"Precipitating factors, Quality, Region/radiation, Severity, Time of onset"},

    {q:"In what order are the resuscitation components performed?",options:["Breathing, Circulation, Airway, Disability","Airway, Breathing, Circulation, Disability, Exposure","Disability, Airway, Breathing, Circulation","Exposure, Disability, Airway, Circulation"],correct:"Airway, Breathing, Circulation, Disability, Exposure"},
    {q:"What does 'V' in AVPU stand for?",options:["Ventilation","Verbal stimuli response","Vital signs","Vascular assessment"],correct:"Verbal stimuli response"},
    {q:"What does the triage nurse do while interviewing one patient?",options:["Focuses entirely on that patient","Continues to visualize all incoming patients","Takes a break","Documents without observing"],correct:"Continues to visualize all incoming patients"},

    {q:"What type of triage manages patients during a large-scale disaster?",options:["Non-disaster triage","Multi-casualty/disaster triage","Resuscitation-only triage","Primary triage"],correct:"Multi-casualty/disaster triage"},

  lec7: [
    {q:"What is angina pectoris?",options:["Complete blockage of a coronary artery","A clinical syndrome of chest pain/pressure due to insufficient coronary blood flow","Accumulation of fluid around the heart","Rupture of a coronary artery"],correct:"A clinical syndrome of chest pain/pressure due to insufficient coronary blood flow"},
    {q:"What is the main cause of angina?",options:["Hypertension alone","Atherosclerotic disease with obstruction of at least one major coronary artery","Viral infection of the heart","Autoimmune disease"],correct:"Atherosclerotic disease with obstruction of at least one major coronary artery"},

let answeredCount = 0;
let correctCount = 0;
let currentTotal = 0;

function updateMeter() {
  document.getElementById("answered").textContent = "Answered: " + answeredCount;
  document.getElementById("correct").textContent = "Correct: " + correctCount;
  const pct = currentTotal > 0 ? (correctCount / currentTotal) * 100 : 0;
  document.getElementById("scoreBar").style.width = Math.min(pct, 100) + "%";
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.exam-section').forEach(sec => sec.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  answeredCount = 0;
  correctCount = 0;
  currentTotal = examData[tabId] ? examData[tabId].length : 0;
  updateMeter();
  renderQuestions(tabId);
}

function renderQuestions(tabId) {
  const section = document.getElementById(tabId);
  section.innerHTML = "";
  if (!examData[tabId] || examData[tabId].length === 0) {
    section.innerHTML = '<div class="empty">No questions available for this section.</div>';
    return;
  }
  let questions = [...examData[tabId]];
  shuffleArray(questions);

  questions.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "question-card";

    const num = document.createElement("div");
    num.className = "question-num";
    num.textContent = "Q" + (index + 1);
    card.appendChild(num);

    const qText = document.createElement("div");
    qText.className = "question-text";
    qText.textContent = item.q;
    card.appendChild(qText);

    let options = [...item.options];
    shuffleArray(options);

    options.forEach(opt => {
      const optDiv = document.createElement("div");
      optDiv.className = "option";
      optDiv.textContent = opt;

      optDiv.onclick = () => {
        const allOptions = card.querySelectorAll(".option");
        allOptions.forEach(o => { o.classList.add("locked"); o.style.pointerEvents = "none"; });
        answeredCount++;
        if (opt === item.correct) {
          optDiv.classList.add("correct");
          correctCount++;
        } else {
          optDiv.classList.add("wrong");
          allOptions.forEach(o => {
            if (o.textContent === item.correct) o.classList.add("correct");
          });
        }
        updateMeter();
      };

      card.appendChild(optDiv);
    });

    section.appendChild(card);
  });
}

currentTotal = examData['lec2'] ? examData['lec2'].length : 0;
renderQuestions('lec2');
updateMeter();

function openDonate() {
  document.getElementById('donateOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDonate() {
  document.getElementById('donateOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeDonateOutside(e) {
  if (e.target === document.getElementById('donateOverlay')) closeDonate();
}

function copyNum(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.classList.remove('copied');
    }, 2000);
  });
}
